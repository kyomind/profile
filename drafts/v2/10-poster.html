<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap&text=KyoHuang" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #141414; color: #ece8e1; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    font-size: 15px; line-height: 1.7;
    min-height: 100vh;
    padding: 2.5vw 3vw 2.25rem;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid #555; }
  a:hover { border-color: #ece8e1; }

  h1 {
    font-family: "Archivo Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-size: min(29vw, 38vh);
    padding-bottom: .2em;
    line-height: .8;
    letter-spacing: -.045em;
    margin-left: -.04em;
  }
  h1 span { display: block; }

  .below {
    margin-top: auto;
    padding-top: 2.5rem;
    border-top: 1px solid #333;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 1.5rem 3rem;
    align-items: start;
    color: #b8b2a8;
  }
  .card { display: flex; gap: 1.25rem; max-width: 34em; }
  .below img { flex: none; width: 44px; height: 44px; object-fit: cover; filter: grayscale(1); display: block; }
  .tag { color: #ece8e1; }
  .below ul { list-style: none; }
  .below h2 { font-size: inherit; font-weight: 400; color: #8a857d; }
  .proj { font-size: 13px; }

  @media (max-width: 760px) {
    body { padding: 5vw 5vw 2rem; }
    h1 { font-size: 27.5vw; }
    h1 span:first-child { font-size: 1.68em; }
    .below { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .card { grid-column: 1 / -1; gap: 1rem; }
  }
</style>
</head>
<body>
  <h1><span>Kyo</span><span>Huang</span></h1>

  <div class="below">
    <div class="card">
      <img src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'">
      <div>
        <p class="tag">Python × AI × DevOps</p>
        <p>軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>
      </div>
    </div>
    <div>
      <h2>產出</h2>
      <p><a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a>　長篇技術筆記</p>
      <p class="proj"><a href="/projects/">專案</a></p>
    </div>
    <div>
      <h2>帳號</h2>
      <ul>
        <li><a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        <li><a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">Threads</a></li>
        <li><a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">X</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
