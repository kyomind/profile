<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=KyoHuang&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3efe4; --ink: #1b1a17; --mute: #4a463d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); color: var(--ink); }
  body {
    font-family: Georgia, "Songti TC", "Noto Serif TC", "PMingLiU", serif;
    font-size: 16px; line-height: 1.7;
    max-width: 1100px; margin: 0 auto; padding: 20px 32px 48px;
  }
  a { color: inherit; }

  .masthead {
    font-family: "UnifrakturMaguntia", "Old English Text MT", serif;
    font-weight: 400; text-align: center;
    font-size: clamp(56px, 11vw, 132px); line-height: 1; padding: 8px 0 14px; white-space: nowrap;
  }
  .dateline {
    display: flex; justify-content: space-between; gap: 12px;
    border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink);
    border-top-width: 4px;
    padding: 5px 2px; font-size: 13px;
  }
  .dateline a { text-decoration: none; }
  .dateline a:hover { text-decoration: underline; }

  .page {
    display: grid; grid-template-columns: 2fr 1fr 1fr; margin-top: 20px;
  }
  .page > section { padding: 0 20px; border-left: 1px solid var(--ink); }
  .page > section:first-child { padding-left: 0; border-left: 0; }
  .page > section:last-child { padding-right: 0; }

  .headline {
    font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
    font-weight: 900; font-size: 34px; line-height: 1.25; margin-bottom: 10px;
  }
  .deck { font-size: 17px; font-style: italic; color: var(--mute);
    border-bottom: 1px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .lead { display: grid; grid-template-columns: 1fr 150px; gap: 18px; align-items: start; }
  .lead p { text-align: justify; font-size: 17px; }
  .lead p::first-letter { float: left; font-size: 3.1em; line-height: 1; padding: 4px 6px 0 0; font-weight: 900; }
  figure img { display: block; width: 150px; height: 150px; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  figcaption { font-size: 12px; color: var(--mute); line-height: 1.4; margin-top: 4px; border-top: 1px solid var(--ink); padding-top: 3px; }

  h2 { font-family: "Songti TC", "Noto Serif TC", serif; font-weight: 900; font-size: 22px;
    line-height: 1.3; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin-bottom: 8px; }
  .kicker { font-size: 13px; font-weight: 700; color: var(--mute); }
  section p { font-size: 15px; }
  ul { list-style: none; }
  ul li { border-bottom: 1px dotted var(--mute); padding: 6px 0; display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  ul li span { color: var(--mute); font-size: 14px; }
  ul a { font-weight: 700; text-decoration: none; }
  ul a:hover, .blog a:hover { text-decoration: underline; }
  .blog a { font-weight: 700; text-decoration: none; }

  @media (max-width: 760px) {
    body { padding: 14px 16px 40px; }
    .masthead { font-size: 16vw; }
    .lead p { text-align: left; }
    .page { grid-template-columns: 1fr; }
    .page > section { padding: 16px 0 0; border-left: 0; border-top: 1px solid var(--ink); margin-top: 16px; }
    .page > section:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .headline { font-size: 26px; }
    .lead { grid-template-columns: 1fr 96px; gap: 12px; }
    figure img { width: 96px; height: 96px; }
  }
</style>
</head>
<body>
  <header>
    <h1 class="masthead">Kyo Huang</h1>
    <div class="dateline">
      <span>kyomind.tw</span>
      <span>Python × AI × DevOps</span>
      <a href="/projects/">專案</a>
    </div>
  </header>

  <main class="page">
    <section>
      <p class="kicker">名片</p>
      <h2 class="headline">相信 AI 與 Infra 是開發者的未來</h2>
      <p class="deck">文／Kyo Huang</p>
      <div class="lead">
        <p>軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>
        <figure>
          <img src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.parentNode.style.display='none'">
          <figcaption>Kyo Huang</figcaption>
        </figure>
      </div>
    </section>

    <section class="blog">
      <p class="kicker">產出</p>
      <h2><a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a></h2>
      <p>長篇技術筆記。<br><a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">blog.kyomind.tw</a></p>
    </section>

    <section>
      <p class="kicker">帳號</p>
      <h2>在這些地方找到我</h2>
      <ul>
        <li><a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">GitHub</a><span>kyomind</span></li>
        <li><a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">LinkedIn</a><span>kyo-huang</span></li>
        <li><a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">Threads</a><span>@kyomind.tw</span></li>
        <li><a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">X</a><span>@kyomind</span></li>
      </ul>
    </section>
  </main>
</body>
</html>
