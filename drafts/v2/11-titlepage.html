<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #f4eee1; color: #2a2620; }
  body {
    font-family: "EB Garamond", "Songti TC", "Noto Serif TC", serif;
    font-size: 17px; line-height: 1.75;
    text-align: center;
    min-height: 100vh;
    padding: 9vh 1.5rem 7vh;
    display: flex; flex-direction: column; align-items: center;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-decoration-thickness: .5px; text-underline-offset: 3px; }
  .sc { font-variant-caps: all-small-caps; font-feature-settings: "c2sc", "smcp"; letter-spacing: .12em; }

  .rule { width: 4.5rem; height: 0; border: 0; border-top: .5px solid #6b6255; margin: 0 auto; }

  h1 {
    font-weight: 400;
    font-size: 2.6rem; line-height: 1.2;
    margin-bottom: 1.6rem;
  }
  .tag { font-style: italic; font-size: 1.15rem; margin: 1.6rem 0 2.2rem; }
  .bio {
    font-family: "Songti TC", "Noto Serif TC", serif;
    font-size: 15px; line-height: 2;
    max-width: 22em; margin: 0 auto; text-wrap: balance;
  }
  .front { margin: 2.6rem 0; }
  .front img { width: 64px; height: 80px; object-fit: cover; filter: grayscale(1) sepia(.25); border-radius: 50%; display: block; }

  .fleuron { font-size: 1.2rem; color: #7a6f5f; margin: auto 0 1.4rem; padding-top: 2rem; }

  .colophon { font-size: 14.5px; line-height: 1.9; color: #4a443b; max-width: 26em; }
  .colophon p + p { margin-top: .6rem; }
  .colophon .zh { font-family: "Songti TC", "Noto Serif TC", serif; }
  .colophon a { border-bottom: .5px solid #a39885; }
  .colophon a:hover { text-decoration: none; border-color: #2a2620; }
  .proj { margin-top: 1.4rem !important; font-size: 13px; }

  @media (max-width: 480px) {
    body { padding-top: 7vh; }
    h1 { font-size: 2.2rem; }
    .front { margin: 2rem 0; }
  }
</style>
</head>
<body>
  <h1 class="sc">Kyo Huang</h1>
  <hr class="rule">
  <p class="tag">Python × AI × DevOps</p>
  <p class="bio">軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>

  <div class="front"><img src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'"></div>

  <div class="fleuron" aria-hidden="true">❦</div>

  <div class="colophon">
    <p class="zh"><a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a>　長篇技術筆記</p>
    <p><span class="zh">帳號　</span>
      <a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer"><span class="sc">GitHub</span></a> ·
      <a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer"><span class="sc">LinkedIn</span></a> ·
      <a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer"><span class="sc">Threads</span></a> ·
      <a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer"><span class="sc">X</span></a></p>
    <p class="proj"><a class="zh" href="/projects/">專案</a></p>
  </div>
</body>
</html>
