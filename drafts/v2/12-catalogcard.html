<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --line: 28px; --ink: #26231e; }
  html { background: #8c8273; }
  body {
    font-family: "Courier Prime", "Courier New", "PingFang TC", "Noto Sans TC", monospace;
    font-size: 15.5px; line-height: var(--line);
    color: var(--ink);
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 2rem 1rem;
  }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .main a { white-space: nowrap; }
  a:hover { background: #e8dcb8; }

  /* 3 x 5 inch catalog card */
  .card {
    position: relative;
    width: min(760px, 100%);
    min-height: 456px;
    background-color: #fbf8ef;
    /* ruled lines; first rule (red) sits under the heading line */
    background-image:
      linear-gradient(#c9504a, #c9504a),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--line) - 1px), #c7d3dc calc(var(--line) - 1px) var(--line));
    background-size: 100% 1px, 100% 100%;
    background-position: 0 calc(var(--line) * 2 + 14px - 1px), 0 14px;
    background-repeat: no-repeat, repeat-y;
    padding: 14px 32px calc(var(--line) * 2.5) 32px;
    box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 20px rgba(0,0,0,.18);
    display: grid;
    grid-template-columns: 7.5em 1fr;
    column-gap: 1.25em;
  }
  /* punched rod hole */
  .card::after {
    content: ""; position: absolute; left: 50%; bottom: 18px;
    width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
    background: #8c8273; box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  .call { grid-row: 1 / span 6; padding-top: var(--line); white-space: pre; }
  .call img {
    width: 56px; height: 56px; object-fit: cover; display: block;
    filter: grayscale(1) contrast(1.05); margin-top: calc(var(--line) * 1.5);
    border: 1px solid #b9ae98;
  }
  .main { grid-column: 2; }
  h1 { font-size: inherit; font-weight: 700; line-height: var(--line); margin-top: var(--line); }
  .ind { padding-left: 2ch; }
  .gap { margin-top: var(--line); }
  ul { list-style: none; }
  .zh { font-family: "PingFang TC", "Noto Sans TC", sans-serif; font-size: 14.5px; }
  .tracing { margin-top: var(--line); }
  .proj { position: absolute; right: 32px; bottom: 14px; font-size: 13.5px; }

  @media (max-width: 600px) {
    body { padding: 1rem .6rem; font-size: 14px; }
    .card { grid-template-columns: 1fr; padding: 14px 18px calc(var(--line) * 3); min-height: auto; }
    .call { grid-row: auto; display: flex; align-items: flex-start; justify-content: space-between; padding-top: 0; }
    .call img { margin-top: 0; width: 48px; height: 48px; }
    .main { grid-column: 1; }
    h1 { margin-top: 0; }
    .zh { font-size: 14px; }
    .proj { right: 18px; }
  }
</style>
</head>
<body>
  <article class="card">
    <div class="call">KYO
H83
<img src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'"></div>

    <div class="main">
      <h1>Huang, Kyo.</h1>
      <p class="ind">Kyo Huang.</p>
      <p class="ind zh">軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>

      <p class="ind gap"><span class="zh">產出：</span><a class="zh" href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a> <span class="zh">長篇技術筆記</span></p>
      <p class="ind"><span class="zh">帳號：</span>GitHub <a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">kyomind</a> ; LinkedIn <a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">kyo-huang</a> ; Threads <a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">@kyomind.tw</a> ; X <a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">@kyomind</a></p>

      <p class="ind tracing">1. Python × AI × DevOps.</p>
    </div>

    <a class="proj zh" href="/projects/">專案</a>
  </article>
</body>
</html>
