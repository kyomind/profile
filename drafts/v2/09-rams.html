<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<style>
  :root {
    --bg: #f1efea;
    --panel: #e7e5df;
    --ink: #2b2b2a;
    --mid: #5e5d5a;
    --rule: #cfccc5;
    --orange: #e8590c;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body {
    margin: 0;
    font: 14px/1.7 "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
  a:hover { border-bottom-color: var(--ink); }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 96px 40px 64px;
  }
  .head {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 40px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--rule);
  }
  .head img {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; display: block;
    filter: grayscale(1);
  }
  h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }
  .tagline { margin: 2px 0 20px; color: var(--mid); }
  .bio { margin: 0; max-width: 30em; font-size: 15px; line-height: 1.9; }

  .row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 40px;
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row h2 { margin: 0; font-size: 12px; font-weight: 400; color: var(--mid); }
  dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; row-gap: 6px; }
  dt { color: var(--mid); }
  dd { margin: 0; }

  .blog { display: flex; align-items: center; gap: 14px; }
  /* the only colour on the page: a Braun-style switch */
  .blog i {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--orange); flex: none;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.18);
  }
  .blog small { color: var(--mid); font-size: 13px; }

  .foot { padding-top: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
  .foot a { color: var(--mid); font-size: 13px; }

  @media (max-width: 640px) {
    main { padding: 48px 24px 40px; }
    .head, .row, .foot { grid-template-columns: 1fr; gap: 16px; }
    .row { gap: 10px; }
    .foot div:first-child { display: none; }
  }
</style>
</head>
<body>
<main>
  <section class="head">
    <img src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'">
    <div>
      <h1>Kyo Huang</h1>
      <p class="tagline">Python × AI × DevOps</p>
      <p class="bio">軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>
    </div>
  </section>

  <section class="row">
    <h2>產出</h2>
    <div class="blog">
      <i aria-hidden="true"></i>
      <a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a>
      <small>長篇技術筆記</small>
    </div>
  </section>

  <section class="row">
    <h2>帳號</h2>
    <dl>
      <dt>GitHub</dt><dd><a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">kyomind</a></dd>
      <dt>LinkedIn</dt><dd><a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">kyo-huang</a></dd>
      <dt>Threads</dt><dd><a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">@kyomind.tw</a></dd>
      <dt>X</dt><dd><a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">@kyomind</a></dd>
    </dl>
  </section>

  <div class="foot">
    <div></div>
    <div><a href="/projects/">專案</a></div>
  </div>
</main>
</body>
</html>
