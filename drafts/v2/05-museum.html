<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<style>
  :root {
    --wall: #e6e5e2;
    --text: #2b2b2a;
    --muted: #5e5d5a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--wall);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 15rem;
    align-items: center;
    gap: 6vw;
    padding: 10vh 8vw 10vh 12vw;
  }
  a { color: inherit; text-decoration: underline; text-decoration-color: #9c9b97; text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--text); }

  /* The artwork: an empty, hung canvas */
  .work {
    aspect-ratio: 4 / 3;
    max-height: 72vh;
    justify-self: end;
    width: 100%;
    background: #efeeeb;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 30px -18px rgba(0,0,0,.22);
  }

  .label { align-self: end; margin-bottom: 4vh; }
  .avatar {
    width: 40px; height: 40px;
    object-fit: cover;
    display: block;
    margin-bottom: 1rem;
  }
  h1 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .tagline { font-style: italic; color: var(--muted); }
  .bio { margin-top: .9rem; }
  .medium { margin-top: .9rem; color: var(--muted); }
  ul { list-style: none; }
  .accounts { margin-top: .9rem; }
  .accounts span { color: var(--muted); display: inline-block; width: 4.6rem; }
  .projects { display: inline-block; margin-top: 1.6rem; color: var(--muted); }

  @media (max-width: 760px) {
    body { display: block; padding: 12vw 8vw 14vw; }
    .work { width: 100%; max-height: none; }
    .label { margin: 12vw 0 0; max-width: 17rem; }
  }
</style>
</head>
<body>
  <div class="work" role="presentation"></div>
  <section class="label">
    <img class="avatar" src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'">
    <h1>Kyo Huang</h1>
    <p class="tagline">Python × AI × DevOps</p>
    <p class="bio">軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>
    <p class="medium"><a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">部落格</a>，長篇技術筆記</p>
    <ul class="accounts">
      <li><span>GitHub</span><a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">kyomind</a></li>
      <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">kyo-huang</a></li>
      <li><span>Threads</span><a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">@kyomind.tw</a></li>
      <li><span>X</span><a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">@kyomind</a></li>
    </ul>
    <a class="projects" href="/projects/">專案</a>
  </section>
</body>
</html>
