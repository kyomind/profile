<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyo Huang</title>
<style>
  :root {
    --washi: #f4efe4;
    --ink: #1c1a17;
    --sumi: #5a554c;
    --shu: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--washi); }
  body {
    color: var(--ink);
    font-family: "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", "PMingLiU", serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--shu); }

  /* Desktop: vertical-rl, columns read right to left */
  main {
    writing-mode: vertical-rl;
    height: 100vh;
    min-height: 620px;
    padding: 12vh 14vw 12vh 10vw;
  }
  .name {
    font-size: 2.6rem;
    font-weight: 600;
    letter-spacing: .18em;
    margin-left: 1.6rem;
  }
  .seal {
    display: inline-block;
    writing-mode: horizontal-tb;
    width: 2.4rem; height: 2.4rem;
    margin-top: 1.4rem;
    background: var(--shu);
    color: var(--washi);
    font-size: .8rem;
    line-height: 2.4rem;
    text-align: center;
    letter-spacing: 0;
    font-weight: 700;
    vertical-align: middle;
    border-radius: 3px;
    transform: rotate(-2deg);
  }
  .tagline {
    font-size: 1rem;
    color: var(--sumi);
    letter-spacing: .12em;
    margin-left: 5rem;
    padding-top: 4.5rem;
  }
  .bio {
    font-size: 1.15rem;
    line-height: 2.3;
    letter-spacing: .14em;
    margin-left: 7rem;
    padding-top: 2rem;
    max-height: 22em;
  }
  .links {
    font-size: 1rem;
    line-height: 2.4;
    letter-spacing: .1em;
    padding-top: 8rem;
    list-style: none;
    margin-left: 2rem;
  }
  .links li { color: var(--sumi); }
  .links a { color: var(--ink); border-left: 1px solid var(--sumi); padding-left: .15em; }
  .links .gap { margin-left: 2.5rem; }
  .avatar {
    width: 56px; height: 56px;
    object-fit: cover;
    filter: grayscale(1);
    display: block;
    margin-top: auto;
    margin-left: 3rem;
  }
  .projects {
    display: block;
    text-align: end;
    font-size: .85rem;
    color: var(--sumi);
    letter-spacing: .2em;
  }

  /* Mobile: horizontal fallback, keep the ma */
  @media (max-width: 760px) {
    main {
      writing-mode: horizontal-tb;
      height: auto;
      min-height: 0;
      display: block;
      padding: 18vw 9vw 14vw;
    }
    .name { font-size: 2rem; margin: 0; display: flex; align-items: center; gap: 1rem; }
    .seal { margin: 0; }
    .tagline { margin: .8rem 0 0; padding: 0; }
    .bio { margin: 3.2rem 0 0; padding: 0; max-height: none; line-height: 2; font-size: 1.05rem; }
    .links { margin: 3.6rem 0 0; padding: 0; line-height: 2.1; }
    .links a { border: 0; border-bottom: 1px solid var(--sumi); padding: 0; }
    .links .gap { margin: 1.4rem 0 0; }
    .desc { display: block; font-size: .9rem; }
    .avatar { margin: 3rem 0 0; display: block; }
    .projects { margin-top: 2rem; display: inline-block; }
  }
</style>
</head>
<body>
<main>
  <h1 class="name">Kyo Huang<span class="seal" aria-hidden="true">Kyo</span></h1>
  <p class="tagline">Python × AI × DevOps</p>
  <p class="bio">軟體工程師，相信 AI 與 Infra 是開發者的未來。擅長用文字記錄學習，希望可以寫到 70 歲。</p>
  <ul class="links">
    <li>部落格　<a href="https://blog.kyomind.tw" target="_blank" rel="noopener noreferrer">blog.kyomind.tw</a><span class="desc">　長篇技術筆記</span></li>
    <li class="gap">GitHub　<a href="https://github.com/kyomind" target="_blank" rel="noopener noreferrer">kyomind</a></li>
    <li>LinkedIn　<a href="https://www.linkedin.com/in/kyo-huang/" target="_blank" rel="noopener noreferrer">kyo-huang</a></li>
    <li>Threads　<a href="https://www.threads.com/@kyomind.tw" target="_blank" rel="noopener noreferrer">@kyomind.tw</a></li>
    <li>X　<a href="https://x.com/kyomind" target="_blank" rel="noopener noreferrer">@kyomind</a></li>
  </ul>
  <img class="avatar" src="https://img.kyomind.tw/1280.jpg" alt="Kyo Huang" onerror="this.style.display='none'">
  <a class="projects" href="/projects/">專案</a>
</main>
</body>
</html>
